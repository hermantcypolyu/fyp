# NeMo RL GRPO on a single A6000 (48 GB), sized against a historical A5000 (24 GB) budget.
# Trainer selection resolved 2026-08-03: NeMo RL, superseding grpo_unsloth_a5000.yaml.
# The `a5000` in this filename is HISTORICAL and should not be read as the target hardware.
#
# GROUNDING STATUS (2026-11-04, revised): NeMo RL is still NOT vendored in this workspace and
# not installed (`import nemo_rl` -> ModuleNotFoundError), so no key below is verified by
# running the real loader on this machine. The schema WAS checked against the pinned upstream
# source, read-only at commit 55296257c96d49cd95c7d77613cb0f36bd4a4dc7. Keys marked
# `GROUNDED` carry a cited file+symbol from that commit; the sampling block and the
# sequence-length block are two such cases.
# Anything not so marked remains `UNGROUNDED` and must be re-checked before a real run
# (spec §1.3: with the source open, not from remembered APIs).
#
# RUNTIME PARITY IS NOT PROVEN. Source reading and example-config agreement are not the same
# as a loader accepting this file. Treat "this config loads and samples as written" as an
# open item until it is run under NeMo RL on Python 3.13.13.

grpo:
  # ---- hazard 2 safety block. Audited vs NeMo RL 55296257. Do not relax. ----
  reward_scaling:
    enabled: false        # source_min 0.0 would clamp every -1.0 gate onto 0.0 (ADR 0006)
    source_min: 0.0
    source_max: 1.0
    target_min: 0.0
    target_max: 1.0
  normalize_rewards: true          # (r - baseline) / (std + 1e-6): sign-agnostic, safe
  use_leave_one_out_baseline: true
  advantage_clip_low: null
  advantage_clip_high: null
  invalid_tool_call_advantage: null
  malformed_thinking_advantage: null

  # ---- scale. UNGROUNDED: key names to be confirmed against upstream configs ----
  num_prompts_per_step: 4
  num_generations_per_prompt: 4    # was 8 on the Unsloth plan; halved for VRAM
  max_num_steps: 10                # smoke first. Success = it completes, not that it learns.

  async_grpo:
    enabled: false                 # non-colocated needs a separate node pool; single GPU cannot

policy:
  model_name: Qwen/Qwen2.5-Coder-1.5B-Instruct

  # ---- SEQUENCE LENGTH: paths GROUNDED against the pinned NeMo RL source (2026-11-04). ----
  # Source: https://github.com/NVIDIA-NeMo/RL at commit
  # 55296257c96d49cd95c7d77613cb0f36bd4a4dc7 (the pin in docs/pinned_versions.md:12).
  # Read-only retrieval at that exact SHA; NeMo RL is NOT installed here, so this is
  # source-grounded but not runtime-executed on this machine.
  #
  # THREE DISTINCT CONCEPTS, deliberately mapped to three distinct fields. They are not
  # interchangeable and must not be collapsed into one number:
  #
  #   1. `max_total_sequence_length` - THE TOTAL BUDGET (prompt + completion).
  #      Declared in nemo_rl/models/policy/__init__.py, `class PolicyConfig(TypedDict)`:
  #        make_sequence_length_divisible_by: int
  #        max_total_sequence_length: int
  #      Both are required members, and PolicyConfig is a field of `MasterConfig`
  #      (nemo_rl/algorithms/grpo.py), which is a Pydantic model with extra="allow" - so
  #      the key must exist and its name must be exactly this.
  #      Runtime consumers (all read it as a direct subscript, so a wrong name is a loud
  #      KeyError, not a silent default):
  #        - nemo_rl/algorithms/grpo.py, grpo_train(): the rollout call sites pass
  #          max_seq_len=master_config.policy["max_total_sequence_length"] to
  #          run_multi_turn_rollout / run_async_multi_turn_rollout / run_nemo_gym_rollout_sync;
  #          validate() passes the same value on the validation path.
  #      It therefore bounds the TOTAL tokens of one trajectory (prompt + generation,
  #      across turns). It is the rollout budget.
  #
  #   2. `policy.generation.max_new_tokens` - THE COMPLETION BUDGET, a different cap.
  #      Declared in nemo_rl/models/generation/interfaces.py,
  #      `class GenerationConfig(TypedDict)`: `max_new_tokens: int`.
  #      Consumed in nemo_rl/models/generation/vllm/vllm_worker.py,
  #      `BaseVllmGenerationWorker._build_sampling_params`:
  #        max_tokens = max_new_tokens if max_new_tokens is not None else self.cfg["max_new_tokens"]
  #      and passed to vLLM `SamplingParams(max_tokens=...)`. This caps the number of tokens
  #      generated per turn; it does not cap the prompt and does not cap the trajectory.
  #      Upstream's own example sets it to `${policy.max_total_sequence_length}` as a
  #      convenience, which is why the two are easy to confuse - that is an interpolation
  #      producing a LARGER-than-needed per-turn cap, not a statement that they are the
  #      same quantity.
  #      DELIBERATELY NOT SET HERE: this protocol defines no completion budget of its own
  #      (configs/training/protocol_1p5b.yaml has no completion-length field), so inventing
  #      one would be inventing a protocol value. The upstream default applies until the
  #      protocol defines one.
  #
  #   3. `policy.generation.vllm_cfg.max_model_len` - ENGINE CONTEXT CAPACITY.
  #      Declared in nemo_rl/models/generation/vllm/config.py,
  #      `class VllmSpecificArgs(TypedDict)`: `max_model_len: int`. It is a vLLM engine
  #      option, NOT a sampler setting, which is why it lives one level deeper than (2).
  #      Consumed in nemo_rl/models/generation/vllm/vllm_worker.py, `_load_model`:
  #        llm_kwargs = dict(..., max_model_len=self.cfg["vllm_cfg"]["max_model_len"], ...)
  #        self.llm = vllm.LLM(**llm_kwargs)
  #      The engine allocates KV cache and enforces the hard ceiling for prompt + generation
  #      on one request. A trajectory longer than this cannot be produced at all, so it must
  #      be >= the total budget in (1). Source evidence that it is a hard ceiling: the same
  #      file asserts `response_length <= self.llm.llm_engine.model_config.max_model_len`
  #      after generation and tells the reader to file a vLLM bug if it ever fails.
  #
  # THE MAPPING, and why 8192 was not raised: configs/training/protocol_1p5b.yaml
  # `model.max_seq_length: 8192` is the arm-independent budget. NeMo RL has no key spelled
  # `model.max_seq_length`; the equivalent total-length field is (1), so 8192 maps there
  # unchanged. (3) is set to the same 8192 because the engine must be able to hold a full
  # trajectory and the pinned source requires nothing larger; raising it would change KV
  # cache footprint on a 24-48 GB card for no protocol reason.
  max_total_sequence_length: 8192   # = protocol_1p5b.yaml model.max_seq_length (total budget)

  generation:
    colocated:
      enabled: true                # vLLM shares the one card with the training policy
    # ---- SAMPLING: paths GROUNDED against the pinned NeMo RL source (2026-11-04). ----
    # Source: https://github.com/NVIDIA-NeMo/RL at commit
    # 55296257c96d49cd95c7d77613cb0f36bd4a4dc7 (the pin in docs/pinned_versions.md:12).
    # Read-only retrieval at that exact SHA; NeMo RL is still NOT vendored or installed here,
    # so this is source-grounded but not runtime-executed on this machine.
    #
    # `temperature` and `top_p` are TOP-LEVEL members of `policy.generation`, NOT members of
    # `policy.generation.vllm_cfg`. Three independent source facts establish this:
    #   1. nemo_rl/models/generation/interfaces.py, `class GenerationConfig(TypedDict)`:
    #        backend: str; max_new_tokens: int; temperature: float; top_p: float;
    #        top_k: int | None; ...
    #   2. nemo_rl/models/generation/vllm/config.py:
    #        `class VllmConfig(GenerationConfig)` adds only `vllm_cfg: VllmSpecificArgs`,
    #        `vllm_kwargs`, `refit_*`, `quant_cfg`. `VllmSpecificArgs` does NOT declare
    #        `temperature` or `top_p` at all, so nesting them there is not a valid location.
    #   3. nemo_rl/models/generation/vllm/vllm_worker.py,
    #      `BaseVllmGenerationWorker._build_sampling_params` reads them as
    #        temperature=self.cfg["temperature"], top_p=self.cfg["top_p"]
    #      where `self.cfg` IS the `policy.generation` mapping. The lookup is a direct
    #      subscript, not `.get()`, so a wrongly-nested key raises KeyError at the first
    #      sampling call rather than being ignored.
    # Corroborated by examples/configs/grpo_math_1B.yaml at the same SHA, which sets
    # `temperature: 1.0` and `top_p: 1.0` directly under `policy.generation`, while
    # `gpu_memory_utilization` sits one level deeper under `policy.generation.vllm_cfg`.
    #
    # Why the values are 1.0: the control arm (configs/eval/baseline.yaml) samples at
    # temperature 1.0 / top_p 1.0. The trained arm must not truncate differently from the
    # control, so it names the same numbers rather than inheriting a library default that no
    # file records and no test pins.
    temperature: 1.0
    top_p: 1.0
    vllm_cfg:
      gpu_memory_utilization: 0.4  # lever 7, and likely the first to bind
      # Engine context capacity - see the long note under `policy` above. Must be >= the
      # total budget (policy.max_total_sequence_length) or no full-length trajectory can be
      # generated, and it is a hard ceiling asserted after generation in
      # nemo_rl/models/generation/vllm/vllm_worker.py. Equal to the budget, not larger:
      # the pinned source requires no extra headroom.
      max_model_len: 8192          # >= policy.max_total_sequence_length (engine capacity)

cluster:
  gpus_per_node: 1
  num_nodes: 1