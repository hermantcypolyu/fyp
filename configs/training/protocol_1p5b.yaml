# Fixed experiment protocol - 1.5B arm. Phase 5.1.
#
# ############################################################################
# ##  STATUS: NEVER EXECUTED.                                               ##
# ##  This file freezes the settings the experiment will use. No run has    ##
# ##  read it. It exists so that the baseline arm, the training arm and the  ##
# ##  final report cannot quietly disagree about what "the experiment" was.  ##
# ############################################################################
#
# WHY THIS FILE EXISTS
#
# AGENT_BUILD_SPEC 5.8 and docs/CURRENT_PROJECT_STATUS.md 4.3 both require that the
# harness, reward, model and dataset are not changed at the same time. A configuration
# that is edited between the control arm and the trained arm makes "RL improved the
# score" unattributable - any difference could be the sampler, the budget, or the
# checkpoint schedule. So the values live in exactly one place, are hashed into every
# run manifest (scripts/run_manifest.py), and are asserted against the arm configs by
# tests so that an edit which breaks the parity fails the build instead of the result.
#
# PROVENANCE VOCABULARY - every value below carries one of four tags:
#
#   GROUNDED    copied from a file or source in this repository, named in the comment
#   CHOSEN      a deliberate choice with no upstream authority; the comment says why
#   ASSUMPTION  a value we expect to be wrong and must measure; the comment says what
#   null        NOT YET DECIDED. A null is a visible gap, not a silent default.
#
# Do not fill a null with a plausible number to make a table look complete. The
# protocol is fixed only where it is known; where it is not, this file says so, and
# scripts/run_manifest.py records the null rather than inventing a value.

meta:
  name: protocol_1p5b
  status: NEVER_EXECUTED
  # Explicit, machine-readable marker. rewards/tests/test_trainer_config_safety.py scans
  # every YAML with a `grpo` section and asks "whose trainer schema is this?" - a question
  # that has no answer for this file, because it configures no trainer. This key is that
  # answer, and it is a declaration rather than an inference from prose.
  kind: arm_independent_protocol
  role: the fixed settings shared by the control arm and the trained arm
  model_tier: 1.5B
  written: 2026-11-04
  # The model progression is fixed (CURRENT_PROJECT_STATUS 4.2): 1.5B is the primary
  # working model and 3B is gated on 1.5B success. This protocol describes the 1.5B arm
  # only; a 3B arm would need its own file with its own hashes, not an edit to this one.

# --------------------------------------------------------------------------- model
model:
  # GROUNDED: configs/eval/baseline.yaml `model.name` and
  # configs/training/grpo_nemo_rl_a5000.yaml `policy.model_name` already agree, and this
  # is the model the whole pipeline has been built and smoke-tested against.
  name: Qwen/Qwen2.5-Coder-1.5B-Instruct
  # GROUNDED 2026-11-04 from a local Hugging Face cache, not from an assumption.
  #
  # A repo name resolves to whatever the current revision is; two runs a week apart can
  # load different weights under the same string with no field in a trace differing. This
  # is now pinned to the immutable commit sha of the snapshot that is actually on disk:
  #
  #   evidence     ~/.cache/huggingface/hub/models--Qwen--Qwen2.5-Coder-1.5B-Instruct
  #   refs/main    2e1fd397ee46e1388853d2af2c993145b0f1098a   (the only snapshot present)
  #   weights      model.safetensors, 3087467144 bytes, 338 tensors, BF16, single shard
  #   completeness header data_offsets sum + header + 8 == file size exactly, so the
  #                download is whole rather than a truncated prefix
  #   cross-check  HfApi().model_info(...).sha == the same sha on 2026-11-04, so the
  #                cached snapshot was also current main, not a stale local fork
  #
  # A pinned revision is safer than `main` even though the two currently agree: `main` is
  # a moving target and the whole point of this field is that it does not move.
  revision: 2e1fd397ee46e1388853d2af2c993145b0f1098a
  # GROUNDED: configs/eval/baseline.yaml matches this so the control arm is 4-bit too;
  # the comparison is then RL-vs-no-RL and not 4bit-vs-16bit.
  load_in_4bit: true
  full_finetuning: false          # GROUNDED: grpo_unsloth_a5000.yaml - must be false for LoRA
  max_seq_length: 8192            # GROUNDED: both arm configs agree. ASSUMPTION as a
                                  # VRAM figure - the source value was measured on an
                                  # H100, and this is the first OOM lever.
                                  #
                                  # WHERE THIS NUMBER GOES. This file configures no
                                  # trainer, so it names the budget without naming a
                                  # trainer key. The formal trainer
                                  # (configs/training/grpo_nemo_rl_a5000.yaml) maps it to
                                  # `policy.max_total_sequence_length: 8192`, because that
                                  # is the pinned NeMo RL field that bounds TOTAL tokens
                                  # (prompt + completion) per trajectory - resolved
                                  # 2026-11-04 against commit 55296257, read-only. The
                                  # same config also sets
                                  # `policy.generation.vllm_cfg.max_model_len: 8192`, the
                                  # engine context ceiling, which must be >= this budget.
                                  # `policy.generation.max_new_tokens` is a SEPARATE
                                  # completion-only cap and is deliberately left unset:
                                  # this protocol defines no completion budget, so setting
                                  # one would be inventing a protocol value.

# --------------------------------------------------------------------------- LoRA
# GRPO/LoRA shape. source: configs/training/grpo_unsloth_a5000.yaml (upstream notebook [S3]).
lora:
  r: 32
  lora_alpha: 64                  # GROUNDED: upstream uses lora_alpha = r * 2
  # GROUNDED: verbatim from the upstream LoRA cell, all seven attention + MLP projections.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  random_state: 42

# --------------------------------------------------------------------------- optimisation
training:
  learning_rate: 1.0e-5          # GROUNDED: upstream GRPOConfig
  weight_decay: 0.001             # GROUNDED
  warmup_ratio: 0.0               # GROUNDED
  lr_scheduler_type: linear       # GROUNDED
  optim: adamw_8bit               # GROUNDED
  # CLI-entropy stability. GROUNDED: F3/F4 recorded runs and grpo_unsloth_a5000.yaml use
  # the same bound; the F4 run's gradient norm was 0.3078 against it, so it did not bind.
  max_grad_norm: 1.0
  per_device_train_batch_size: 1  # GROUNDED
  gradient_accumulation_steps: 16 # CHOSEN: upstream uses 64 on an H100; 16 keeps a step
                                  # short enough to debug. VRAM-neutral if raised.
  # CHOSEN - ITERATION BUDGET. Phase 7 asks for 2-5 update iterations initially, so the
  # ceiling is set there rather than at the upstream tutorial's 100 steps. A run that
  # exceeds this is not this protocol's run.
  training_iterations: 5
  # CHOSEN - CHECKPOINT SCHEDULE. Save after every step at this scale: five checkpoints
  # of a LoRA adapter are small, and the alternative (save at the end) loses the only
  # evidence of intermediate behaviour if the last step diverges.
  checkpoint_every_n_iterations: 1

# --------------------------------------------------------------------------- rollouts
# One GRPO group = one task sampled k times. Group size is what makes the group's
# standard deviation meaningful, and it is the setting most likely to meet VRAM.
rollouts:
  # GROUNDED: grpo_nemo_rl_a5000.yaml `num_generations_per_prompt`, already halved from 8
  # for a 24 GB card. This is the value the trainer config would actually use.
  # NOT raised for the A6000 the code runs on: the halving is part of the settings every
  # recorded run used, so changing it would break comparability for no measured gain.
  group_size: 4
  # CHOSEN - TASK COUNT. Phase 7 says "few training tasks". Four prompts per step x 4
  # rollouts = 16 episodes per step, which is the largest step we have any evidence the
  # box can finish. A larger task count is a later experiment, not this protocol.
  n_tasks: 4
  # DERIVED, recorded so it cannot drift: rollouts per task IS group size. Listed
  # separately because Phase 5.1 asks for both, and because they are the same number
  # for a reason (a task is sampled exactly once as a prompt per step).
  rollouts_per_task: 4

# --------------------------------------------------------------------------- sampling
sampling:
  temperature: 1.0                # GROUNDED: both arm configs agree
  # CHOSEN - RESOLVED 2026-11-04, and recorded as a choice rather than a discovery.
  #
  # This was `null` because the control arm set `top_p: 1.0` while the active trainer set
  # nothing, so "both arms use 1.0" rested on a framework default nobody had verified -
  # the thing AGENT_BUILD_SPEC §1.2 forbids treating as a configured value. The gap is now
  # closed by *configuring* it in both arms rather than by *assuming* the default:
  #   configs/eval/baseline.yaml               sampling.top_p: 1.0  (already set)
  #   configs/training/grpo_nemo_rl_a5000.yaml policy.generation.top_p: 1.0 (added)
  #
  # KEY PATH RESOLVED 2026-11-04 against the pinned NeMo RL source (commit
  # 55296257c96d49cd95c7d77613cb0f36bd4a4dc7, read-only at that SHA). `top_p` and
  # `temperature` are TOP-LEVEL members of `policy.generation`, NOT members of
  # `policy.generation.vllm_cfg`: `GenerationConfig` in
  # nemo_rl/models/generation/interfaces.py declares them directly, `VllmSpecificArgs` in
  # nemo_rl/models/generation/vllm/config.py does not declare them at all, and
  # `_build_sampling_params` in nemo_rl/models/generation/vllm/vllm_worker.py reads
  # `self.cfg["top_p"]` / `self.cfg["temperature"]` where `self.cfg` is the
  # `policy.generation` mapping. The earlier third-party contradiction (NeMo Gym's aviary
  # README vs multichallenge_nrl.yaml:30) is settled in favour of the latter: sampling is
  # at `policy.generation`, and only engine options such as `gpu_memory_utilization` sit
  # under `vllm_cfg`.
  #
  # STILL NOT RUNTIME-VERIFIED: NeMo RL requires Python >=3.13.13,<3.14 and is not installed
  # here, so this file has not been loaded by the real parser. The path is source-grounded;
  # runtime acceptance remains a blocking open item before any training run.
  #
  # The value: 1.0 disables nucleus truncation, so the full distribution is sampled and
  # temperature is the only thing shaping the sampler. That is the conservative choice for
  # this experiment - a truncated nucleus in one arm and not the other would be a sampler
  # difference masquerading as an RL effect, which is precisely the confound this file
  # exists to prevent. It is NOT a grounded upstream value: no config we have evidence for
  # selected it, so the manifest records it as a choice.
  top_p: 1.0
  # GROUNDED: configs/eval/baseline.yaml `sampling.seed`.
  seed: 42

# --------------------------------------------------------------------------- episode budget
episode:
  # From each task's task.yaml (constraints.max_turns / max_tool_calls), not set here.
  # GROUNDED as a policy: configs/eval/baseline.yaml already does this, so a task's own
  # budget stays authoritative and the two arms cannot diverge. Recorded per rollout in
  # the trace's `budgets` block.
  max_turns: from_task_yaml
  max_tool_calls: from_task_yaml

# --------------------------------------------------------------------------- GRPO objective
grpo:
  # GRPO's own advantage is (r - mean_group) / (std_group + eps): sign-agnostic and safe
  # for the [-1, 1] reward of ADR 0006. GROUNDED: nemo_rl GRPOAdvantageEstimator.
  advantage_estimator: group_relative
  # GROUNDED: upstream GRPOConfig `epsilon_high`. The trainer's lower clip is the
  # symmetric default of the same value.
  clip_epsilon: 0.28
  # NOT APPLICABLE - NOT A GAP. Recorded anyway because Phase 5.1 asks for it.
  #
  # The controlled update has NO reference model and therefore no KL term
  # (docs/PHASE4_GRPO_AUDIT.md 4.2). A null here means "absent", not "zero": writing 0.0
  # would claim a KL term exists and is switched off, which is a different and stronger
  # claim about the objective.
  #
  # `status` is what distinguishes this from the two gaps that ARE blockers. A null
  # top_p or revision meant "nobody has decided yet, and a run would proceed on a
  # default" - those had to be resolved before a pilot. This one means "the quantity does
  # not exist in this implementation", so it can never be resolved by choosing a number
  # and must never block a run. Kept as a null so the manifest still reports it; the
  # status tells a reader whether the null is an open question or a closed one.
  kl_coefficient: null
  kl_coefficient_status: NOT_APPLICABLE_CURRENT_IMPLEMENTATION
  kl_coefficient_reason: no reference-policy KL term exists in the current controlled GRPO-style implementation
  # GROUNDED: grpo_nemo_rl_a5000.yaml truncation policy.
  #
  # Named `drop_` rather than the trainer's `mask_truncated_completions` on purpose. This
  # file is an arm-independent protocol, not a trainer config, and the trainer's name for
  # this setting is one of TRL's schema fingerprints - carrying it here made
  # rewards/tests/test_trainer_config_safety.py classify this file as a TRL config and fail.
  # The test is right: a protocol file that looks like a trainer config is ambiguous, and
  # the trainer already covers the real hazard. Same meaning, no false signal.
  drop_truncated_completions: true

# --------------------------------------------------------------------------- reward
# The reward is part of the protocol because a reward change between arms is a confound.
reward:
  # Which reward the *runtime* scores with. rewards/compose.py (reward_v1) is what
  # envs/coding_env/verifier.py imports; rewards/v2.py is not called by any live path.
  live: reward_v1
  # Which reward the analysis reports. reward_v2 is computed offline over recorded
  # rollouts by scripts/reward_distribution.py and does not change what the agent sees.
  analysed: reward_v2
  # GROUNDED: ADR 0006. Recorded so a run manifest can detect a reward-range change.
  range: [-1.0, 1.0]

# --------------------------------------------------------------------------- data
data:
  # GROUNDED: docs/heldout_seal.md. The held-out split is sealed and is not used to
  # train, to select a checkpoint, or to sanity-check the harness. The trace hash is
  # checked by `make seal-check`; this line records which side of the seal a run is on.
  split: train
  validation_from: train          # GROUNDED: grpo_nemo_rl_a5000.yaml - checkpoint
                                  # selection uses a slice of train ONLY
  heldout_enabled: false          # flip once, at the very end (configs/eval/baseline.yaml)

# --------------------------------------------------------------------------- hardware
hardware:
  # TWO FACTS, recorded separately because conflating them produced a false claim.
  #
  # `target_gpu` previously read "RTX A5000 (24 GB)", which was a design assumption carried
  # over from the planning phase and never checked against a machine. The hardware the work
  # actually executes on is an A6000 (~48 GB per card, two cards present), and the completed
  # controlled run F4 recorded an A6000 as well - see docs/PHASE_F4_CONTROLLED_UPDATE.md.
  #
  # The conservative settings below were NOT loosened to match the larger card. They are kept
  # for stability and comparability: every VRAM figure and every timing already in the record
  # was produced under them, and a pilot that changed group size, sequence length or
  # concurrency at the same time as everything else would confound itself. The settings are
  # therefore a policy choice, not a statement that the current GPU has 24 GB.
  #
  # GROUNDED: nvidia-smi on the execution host (hostname POLYVERSE) on 2026-11-04 reported
  # two "NVIDIA RTX A6000" devices at 49140 MiB each, driver 535.309.01.
  target_gpu: "RTX A6000 (48 GB)"
  # HISTORICAL DESIGN CONSTRAINT, retained deliberately. The A5000 was the sizing target the
  # protocol was reasoned against: group size halved to 4, max_seq_length 8192 as the first
  # OOM lever, gpu_memory_utilization 0.4. Those numbers stay as they are, so this line is
  # what stops a later reader concluding they were chosen for an A6000.
  historical_design_target_gpu: "RTX A5000 (24 GB)"
  # Phase 5.3: the experiment uses one device, and every command names it explicitly. This is
  # unchanged by the larger card: a second GPU existing is not a reason to use it mid-experiment.
  cuda_visible_devices: "0"
