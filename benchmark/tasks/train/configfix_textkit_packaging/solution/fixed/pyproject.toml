[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "textkit"
version = "0.4.1"
description = "Small, dependency-free text helpers: slugs and case conversions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "textkit contributors" }]
keywords = ["slug", "slugify", "case", "text"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://example.invalid/textkit"

[tool.hatch.build.targets.wheel]
packages = ["textkit"]

[tool.ruff]
line-length = 100
