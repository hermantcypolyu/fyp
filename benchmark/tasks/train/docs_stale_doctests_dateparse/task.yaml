id: docs_stale_doctests_dateparse
category: docs_improve
difficulty: easy
split: train

instruction: >
  How this package renders and returns dates was changed a while back, and nobody went
  back to the docstrings. The interactive examples in src/dateparse.py no longer describe
  what the functions do, so `python -m doctest src/dateparse.py` is noisy where it used to
  be silent: several examples show output text the code never produces, one shows a value
  of a type the function does not return, and one shows a traceback for an input the
  function now accepts quite happily. The behaviour is the correct behaviour and callers
  depend on it, so do not bend the code to make an old example true again - the examples
  are what is wrong. Bring every one of them into line with what the module really does,
  and keep them: correct each in place rather than deleting it or silencing it with a
  doctest directive, and leave every docstring with at least the two examples it has now.
  Public names, signatures and return values must stay exactly as they are.

repo:
  root: repo/
  loc: 150
  entrypoint_hint: src/dateparse.py

verification:
  runner: pytest
  test_files: [tests/test_dateparse_docs.py]
  timeout_s: 60
  n_tests: 14
  floor_tests: 7
constraints:
  allowed_write_globs:
    - "repo/src/**"
    - "repo/*.md"
  forbidden_write_globs:
    - "tests/**"
    - "solution/**"
    - "**/conftest.py"
    - "task.yaml"
    - "repo/smoke/**"
  max_turns: 20
  max_tool_calls: 40

provenance:
  source: textbook_pattern
  license: MIT
  notes: >
    Authored for this benchmark; no upstream commit was inverted. Doctests that rotted
    out from under the code they document are one of the most common documentation
    defects in Python, precisely because a docstring example is only executable if
    somebody remembers to execute it: CPython, numpy, pandas and requests all run their
    doctests in CI for exactly this reason, and every project that does not has this
    defect somewhere. Rated easy because the symptom names the file and the fix is
    mechanical once the examples are actually run. The interesting property is that the
    honest fix and the cheating fix are edits to the same file - docstrings live inside
    the module, so the agent must be allowed to write it, and the only thing standing
    between it and "make the example true by changing the function" is that the hidden
    suite re-asserts the real behaviour alongside the examples.

metadata:
  expected_files_changed: 1
  created: 2026-07-31
  tags: [doctest, docstring-drift, stale-examples, dates]
