[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reportkit"
version = "0.8.2"
description = "Plain-text reports, with optional renderers behind extras."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "reportkit contributors" }]
keywords = ["report", "table", "text"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "jinja2>=3.1",
]

[project.optional-dependencies]
yaml = [
  "PyYAML>=6.0",
]
excel = [
  "openpyxl>=3.1",
]
fast = [
  "orjson>=3.9",
]

[project.urls]
Homepage = "https://example.invalid/reportkit"

[tool.hatch.build.targets.wheel]
packages = ["reportkit"]

[tool.ruff]
line-length = 100
