[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectool"
version = "2.0.0"
description = "Tiny record validation against a compact schema."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dataspec contributors" }]
keywords = ["schema", "validation", "records"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://example.invalid/dataspec"

[tool.hatch.build.targets.wheel]
packages = ["spectool"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
