[project]
name = "tallyman"
version = "0.3.0"
description = "Tally simple category/amount ledgers"
requires-python = ">=3.10"

[project.scripts]
tally = "tallyman.commands.count:main"
tally-report = "tallyman.commands.report:main"

[tool.setuptools]
packages = ["tallyman", "tallyman.commands"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
