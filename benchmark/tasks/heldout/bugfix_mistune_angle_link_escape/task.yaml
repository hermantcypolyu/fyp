id: bugfix_mistune_angle_link_escape
category: bug_fix
difficulty: hard
split: heldout

instruction: >
  A link whose destination is wrapped in angle brackets loses everything the moment a
  backslash appears inside it. `[link](<foo\*bar>)` does not become a link at all - it
  degrades silently to literal text, and the same happens to a reference definition
  written as `[x]: <a\*b>`. Drop the angle brackets and write the destination bare and the
  identical escape is accepted, so the two spellings of the same destination disagree with
  each other. Escapes are supposed to work in both: the parser already has machinery that
  consumes a backslash together with the character after it, and a later stage resolves
  those escapes before the URL is built. Only the angle-bracket branch refuses to take
  part. Make it agree with its sibling, without loosening the terminators - an unescaped
  `<`, a line ending or a NUL byte must still end the destination exactly as now, and a
  destination that ends on a dangling backslash must still be rejected rather than reading
  past the end of the input.

